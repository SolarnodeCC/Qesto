auditor_version = "1.7.6"
# Supply-chain pin (issue #613): the jankurai hub is vendored via the
# `jankurai-workspace` dependency in package.json and locked in package-lock.json
# to a full commit SHA — not the mutable `v1.7.6` tag. Since v1.7.x the hub is not
# a Cargo workspace; CI runs the hub's installer from that locked copy, which
# verifies the signed v<auditor_version> release (checksum, pinned release key,
# provenance, binary version) before installing it. This SHA is the single source
# of truth for which hub/installer gates the repo. Keep in sync with package-lock.json.
auditor_source = "github:neverhuman/jankurai"
