# Generated file zones — DO NOT EDIT BY HAND in these paths.
# Schema: jankurai 1.6.10 (path, source, command, read_only)

[[zone]]
path = "contracts/generated/api.d.ts"
source = "contracts/openapi/qesto-api.yaml"
command = "npm run contracts:generate"
read_only = true

[[zone]]
path = "agent/repo-score.json"
source = "jankurai audit"
command = "just score"
read_only = false
write_policy = "auditor_output"

[[zone]]
path = "agent/repo-score.md"
source = "jankurai audit"
command = "just score"
read_only = false
write_policy = "auditor_output"

# contracts/openapi-v3.json is generated from the typed spec in
# functions/api/lib/openapi-v3-spec.ts and gated against drift by
# scripts/check-contract-drift.ts (wired into ops/ci/contracts.sh as
# `npm run check:contracts`).
#
# It is deliberately NOT declared as a [[zone]] here. Declaring it was tried for
# issue #690 and made the audit strictly worse: the auditor kept reporting
# HLT-007 ("no generated zone entry") for the path regardless, and additionally
# raised HLT-002 (generated zone integrity violation) — with and without
# write_policy = "generator_only". Both findings are detector behaviour, not
# repo drift: `npm run check:contracts` passes, so the artifact is in sync with
# its source. Re-declaring the zone without an upstream fix only adds a second
# false finding. See the triage in issue #691.
#
# The "-v3" suffix names the OpenAPI specification version (a real external
# standard), not a project version, so the HLT-040 fake-version finding on this
# path is also a false positive and the filename is kept.
