name: CodeQL

# GitHub-native static analysis (SAST) for JS/TS, feeding results into the
# repository Security tab. Complements — does not replace — the existing
# homegrown scans: secret-scan.sh (token patterns), supply-chain.sh (npm audit +
# gitleaks), and the jankurai audit. Runs on PRs to main and weekly.

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 04:27 UTC — offset from the other scheduled lanes.
    - cron: '27 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Inline by design: CodeQL is the init/analyze actions pair with no shell
# step to extract into ops/ci/*.sh (jankurai HLT-042, #688).
jobs:
  analyze:
    name: analyze · javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload findings to the Security tab
    steps:
      # Pin to full commit SHA — tag refs can change without review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # DD-02 (#875): a hard gate. Code scanning results upload on this repository
      # (GitHub Advanced Security is enabled; verified on PR #972: "Successfully
      # uploaded results"), so the advisory `continue-on-error` is gone — a
      # CodeQL failure now fails the check instead of passing silently.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # JS/TS is interpreted — no compiler invocation needed.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
