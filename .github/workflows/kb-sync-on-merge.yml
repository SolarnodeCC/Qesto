name: KB Sync on Merge

on:
  push:
    branches:
      - main
    paths:
      - 'knowledge-base/**'
      - 'scripts/kb-sync-cli.ts'
      - 'scripts/embed-kb.ts'
      - 'scripts/kb-health.ts'
      - '.github/workflows/kb-sync-on-merge.yml'

permissions:
  contents: read
  issues: write # open/update the failure issue below
  actions: read # read prior run artifacts to restore the sync manifest

concurrency:
  group: kb-sync-${{ github.ref }}
  # NOT cancel-in-progress (audit #18): a sync writes Vectorize and D1 in
  # batches, and the manifest artifact is only uploaded at the end. Cancelling
  # a run mid-flight leaves the index partially written with no record of what
  # landed, and the next run restores the manifest from the last *successful*
  # run — so the interrupted work is invisible to it. Queueing costs a few
  # minutes; cancelling costs index integrity.
  cancel-in-progress: false

jobs:
  kb-sync:
    runs-on: ubuntu-latest
    # 40 min: a defense-in-depth margin on top of the embed-kb.ts concurrency
    # fix (EMBED_CONCURRENCY) — protects against a slow Workers AI endpoint or
    # a future large doc dump re-triggering the same timeout failure mode.
    timeout-minutes: 40
    # The secrets context is not allowed in step `if:` expressions — map the
    # webhook into job env so the Slack step can gate on `env.*` instead.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    permissions:
      contents: read
      issues: write # open/update the failure issue below
      actions: read # read prior run artifacts to restore the sync manifest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'

      # The sync manifest (.kb-sync-manifest.json) holds per-file hashes + vector
      # ids from the last sync — the state that lets this run detect changed AND
      # deleted docs. It is runtime state (not committed), so restore it from the
      # most recent successful run's artifact. Missing/empty is safe: the sync
      # then treats every file as new and prunes nothing.
      - name: Restore previous sync manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow kb-sync-on-merge.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ]; then
            echo "Restoring manifest from run $run_id"
            gh run download "$run_id" -n kb-sync-manifest --dir . \
              || echo "No manifest artifact on run $run_id — starting fresh."
          else
            echo "No previous successful run — starting with an empty manifest."
          fi

      - name: Run KB Sync
        run: bash ops/ci/kb-sync.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KB_ADMIN_KEY: ${{ secrets.KB_ADMIN_KEY }}

      # The sync above is advisory (it never fails the job). This gate is the
      # real pass/fail signal: it fails the workflow if the live KB index is
      # empty while KB files exist, or its dimensions don't match the embed
      # model — i.e. retrieval is broken. (deps already installed by kb-sync.sh)
      - name: KB health gate
        run: |
          # Vectorize upserts are eventually consistent — let them settle
          # before asserting the index is populated and dimensionally correct.
          sleep 30
          npm run kb:health -- --require-remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload sync manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kb-sync-manifest
          path: .kb-sync-manifest.json
          retention-days: 30

      # Both previous alert paths were dead: the PR-comment step gates on
      # `github.event_name == 'pull_request'` while this workflow runs on
      # push/schedule, and the Slack step gates on a SLACK_WEBHOOK_URL secret
      # that is not set. A failure therefore reached nobody (audit #1/#2).
      # A GitHub issue needs no external secret. Reuses one open issue per lane
      # so repeated failures update instead of spamming.
      - name: Open or update a failure issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'KB sync lane is failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The **${context.workflow}** lane failed on \`${context.sha}\`.`,
              '',
              `- Run: ${runUrl}`,
              `- Branch: \`${context.ref}\``,
              '',
              'The KB vector index may be unsynced, empty, stale, or dimensionally',
              'mismatched with the embedding model. A common cause is a missing or',
              'expired `CLOUDFLARE_API_TOKEN` repository secret — the lane needs it to',
              'reach the live indexes and fails within seconds without it.',
            ].join('\n')
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'vectorize-health', per_page: 20,
            })
            const match = existing.data.find((i) => i.title === title)
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['vectorize-health'],
              })
            }

      - name: Notify Slack (on failure)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          payload: |
            {
              "text": "❌ KB Sync / Health Gate Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*KB Sync / Health Gate Failed*\nThe live KB vector index may be empty, stale, or dimensionally mismatched.\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref }}\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\nWorkflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
