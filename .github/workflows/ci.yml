name: CI

on:
  # Feature branches are validated once, on their PR — not also on every branch
  # push (that doubled every run). main still runs full CI + the deploy job.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only changes don't need the test/build suite.
    paths-ignore:
      - '**/*.md'
      - 'knowledge-base/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: quality-gates · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Pin to full commit SHA — tag refs can change without review
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'

      # Quality gates — runs local quality-gates.sh script
      - name: Run quality gates
        run: bash ops/ci/quality-gates.sh

      - name: Check migration numbers (no duplicates)
        run: bash ops/ci/check-migration-numbers.sh

      - name: Contracts drift check
        run: bash ops/ci/contracts.sh

      # Upload audit artifacts for agent repair routing
      - name: Upload audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-results
          path: |
            agent/repo-score.json
            agent/repo-score.md
          retention-days: 30

      # Upload coverage artifacts
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: build · deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gate the production deploy behind the `production` Environment. Configure it
    # in Settings → Environments with a required reviewer (or a wait-timer) and
    # move the Cloudflare secrets below to environment scope, so a push to main
    # pauses for approval before wrangler deploys + purges cache instead of
    # shipping straight to qesto.cc. See
    # knowledge-base/operations/security/GITHUB_INFRA_AUDIT_2026-07.md (finding C2).
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # DD-08 — the Worker API used to deploy only via the Cloudflare Workers
      # Builds Git integration, entirely outside this pipeline: neither the
      # quality gates in `needs: ci` nor the `environment: production` approval
      # applied to it, and a docs-only commit could ship the API with no test
      # run. Deploying it here puts it behind both.
      #
      # ORDER: API first, frontend second. Additive API changes must be live
      # before the UI that calls them; the reverse briefly serves a frontend
      # against an API that lacks its endpoints.
      #
      # NOTE: disable the Workers Builds and Pages Git integrations in the
      # Cloudflare dashboard when this lands, or both will deploy the same
      # commit twice and race. Tracked in the DD-08 / DD-20 issues.
      - name: Deploy API (Worker)
        run: node scripts/deploy-api.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://qesto.cc
          # Keep in sync with SUPERUSER_EMAIL and CHECKOUT_URL runtime vars on Cloudflare Pages.
          VITE_SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
          VITE_CHECKOUT_URL: ${{ secrets.CHECKOUT_URL }}

      - name: Get commit SHA
        id: sha
        run: printf 'sha=%s\n' "$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=qesto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ steps.sha.outputs.sha }}

      # DD-37 — `purge_everything` dropped the entire global edge cache on every
      # release: a latency spike and an origin-load spike per deploy, for no
      # benefit. Static assets are content-hashed (`/assets/[name]-[hash]`) and
      # served `immutable`, so they never need purging. Only the HTML shell,
      # which carries `s-maxage=60`, has a stable URL.
      - name: Purge Cloudflare cache (HTML shell only)
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID is empty; skipping HTML shell cache purge"
            exit 0
          fi
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"files":["https://qesto.cc/","https://qesto.cc/index.html"]}'

      - name: Verify deploy (commit parity + asset MIME types)
        run: node scripts/verify-deploy.mjs https://qesto.cc
        env:
          GITHUB_SHA: ${{ github.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # DD-08 — this step read `.d1`/`.kv`/`.do`, which the handler has never
      # returned at any nesting level, so jq yielded null and the step failed on
      # every single release (after the deploy and purge had already run), while
      # verifying nothing. The handler now performs real probes and reports them
      # under `.data.checks`; tests/unit/health-contract.test.ts pins that shape
      # so this script and the handler cannot silently drift apart again.
      - name: Verify API health
        run: |
          set -euo pipefail
          echo "Checking API health endpoint..."
          # A degraded dependency returns 503, which -f turns into a non-zero exit.
          health=$(curl -sf https://qesto.cc/api/admin/health)

          d1_ok=$(echo "$health" | jq -r '.data.checks.d1')
          kv_ok=$(echo "$health" | jq -r '.data.checks.kv')
          do_ok=$(echo "$health" | jq -r '.data.checks.do')

          echo "D1: $d1_ok | KV: $kv_ok | DO: $do_ok"

          if [ "$d1_ok" != "ok" ] || [ "$kv_ok" != "ok" ] || [ "$do_ok" != "ok" ]; then
            echo "ERROR: API health check failed" >&2
            echo "$health" | jq . >&2
            exit 1
          fi

          echo "✓ All API systems healthy"

      - name: Platform v7 smoke (OPS-S99-CLOSEOUT-01)
        run: node scripts/smoke-platform.mjs https://qesto.cc
