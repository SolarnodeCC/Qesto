name: CI security · jankurai audit

on:
  # Docs-only changes don't move the repo-shape/security posture jankurai audits,
  # so skip them on both triggers to save Actions minutes.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'knowledge-base/**'
      - 'docs/**'
  # Run the audit BEFORE merge, not only after (issue #612). Without a
  # pull_request trigger the ratchet witness could only observe a regression on
  # the next push to main — by which point the bad commit was already merged.
  # Making the lane a required check in branch protection (so a ratchet failure
  # blocks the PR) is the complementary GitHub-settings step tracked in #612.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'knowledge-base/**'
      - 'docs/**'

concurrency:
  group: jankurai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: jankurai audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # jankurai is a Rust CLI. The `jankurai-workspace` dependency in package.json
      # is the jankurai hub (installer + family.lock), pinned in package-lock.json
      # to a full commit SHA. Since v1.7.x the hub is no longer a Cargo workspace
      # (the CLI moved to the split jankurai-core repo), so install the signed
      # release with the hub's own installer from that SHA-locked copy: it checks
      # the tarball's checksum, its signature against a release key pinned in the
      # installer, the provenance and the binary version. The release tag comes
      # from auditor_version in agent/standard-version.toml (single source of truth).
      - name: Install jankurai (pinned auditor_version, from locked hub installer)
        run: |
          version="$(grep -E '^auditor_version' agent/standard-version.toml | sed -E 's/[^"]*"([^"]+)".*/\1/')"
          hub_version="$(tr -d '[:space:]' < node_modules/jankurai-workspace/VERSION)"
          if [ "$hub_version" != "$version" ]; then
            echo "::error::node_modules/jankurai-workspace is v$hub_version but agent/standard-version.toml pins auditor_version $version"
            exit 1
          fi
          JANKURAI_RELEASE_TAG="v$version" JANKURAI_INSTALL_DIR="$HOME/.local/bin" \
            bash node_modules/jankurai-workspace/jankurai-installer.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jankurai" version | grep -q "$version"
          "$HOME/.local/bin/jankurai" version

      - name: Prepare output dirs
        run: mkdir -p target/jankurai agent target/jankurai/proofbind target/jankurai/security

      # Advisory (report-only) mode: the audit reports the score and repair queue
      # without failing CI. The repo's honest score (68 under v1.7.6; 64 under
      # v1.6.10) does not yet meet the aspirational minimum_score=85 floor, and most
      # hard findings are known false positives / upstream-detector gaps (generated
      # gh-aw lockfile, guard-hook self-matches, ownerless paths) rather than real
      # defects. Ratchet gating will be re-enabled once remediation reaches the
      # floor. The tracked baseline (agent/baselines/main.repo-score.json) is the
      # last accepted v1.6.10 report; re-baselining under v1.7.6 is a maintainer call.
      - name: audit-ci
        run: jankurai audit . --mode advisory --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md

      - name: proof-routing
        run: jankurai audit . --mode advisory --json agent/repo-score.json --md agent/repo-score.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl

      # Remaining lanes run in advisory mode too (continue-on-error): they report
      # evidence and upload artifacts without gating the workflow while the repo is
      # below the aspirational floor. Re-tighten (drop continue-on-error) alongside
      # re-enabling ratchet once remediation lands.
      - name: proofbind
        continue-on-error: true
        run: jankurai proofbind verify . --changed-from origin/main

      - name: copy-code
        continue-on-error: true
        run: jankurai copy-code . --json target/jankurai/copy-code.json --md target/jankurai/copy-code.md

      - name: security
        continue-on-error: true
        run: jankurai security run . --strict --profile ci --out target/jankurai/security/evidence.json

      - name: db-migration-analyze
        continue-on-error: true
        run: jankurai migrate . --analyze --out target/jankurai/migration-report.json

      - name: ux-qa
        continue-on-error: true
        run: jankurai ux audit --config agent/ux-qa.toml --out target/jankurai/ux-qa.json

      - name: Upload Jankurai audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jankurai-audit
          path: |
            agent/repo-score.json
            agent/repo-score.md
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/repair-queue.jsonl
            target/jankurai/copy-code.json
            target/jankurai/copy-code.md
            target/jankurai/security/evidence.json
            target/jankurai/migration-report.json
            target/jankurai/ux-qa.json
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/proofbind/obligations.json
          retention-days: 7

  security:
    name: supply-chain security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run supply chain security scan
        run: bash ops/ci/supply-chain.sh

      - name: Upload security scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-scan-results
          path: target/security/
          retention-days: 30
