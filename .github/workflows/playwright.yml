name: Playwright Tests
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'worker/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright.yml'
  push:
    branches: [ main ]
    # Only run the (expensive) E2E suite when app code or the E2E harness changes;
    # docs/KB merges skip it entirely.
    paths:
      - 'src/**'
      - 'functions/**'
      - 'worker/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright.yml'

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: '24'
        cache: 'npm'
    # The whole lane (deps, browsers, build, D1, server, tests) lives in
    # ops/ci/playwright.sh + the config's webServer block, so CI and a local
    # run execute the same code path (issues #688, #692).
    - name: Playwright E2E lane
      run: bash ops/ci/playwright.sh
      env:
        WRANGLER_SEND_METRICS: 'false'

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: tests/artifacts/playwright-report/
        retention-days: 30
